[project]
name = "lazy-tidier"
version = "0.1.0"
description = "Offline AI file organizer for your Downloads folder (Ollama, no cloud)"
readme = "README.md"
authors = [
    { name = "Devin AI", email = "158243242+devin-ai-integration[bot]@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "rapidocr-onnxruntime>=1.4.4",
    "typer>=0.27.3",
    "watchdog>=6.0.0",
]

[project.scripts]
tidy = "tidier.cli:main"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "tidier"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/tidier/cli.py" = ["B008", "BLE001"]   # typer.Option defaults; per-file errors shouldn't kill the batch
"src/tidier/extract.py" = ["BLE001"]       # corrupt/unparseable files must never crash the pipeline
"src/tidier/llm.py" = ["BLE001"]           # health check: any failure = model down
